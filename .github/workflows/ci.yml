name: CI Pipeline

on:
  pull_request:
    branches: [dev, main]

jobs:
  # ─── Tests Unitaires ─────────────────────────────────────────
  # Responsable : Développeur
  # Pas de dépendance externe (mocks uniquement)
  unit-tests:
    name: "Tests Unitaires"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run frontend unit tests with coverage
        run: flutter test test/unit/ --coverage

      - name: Install server dependencies
        run: cd server && dart pub get

      - name: Analyze server code
        run: cd server && dart analyze

      - name: Run server unit tests
        run: cd server && dart test test/unit/

  # ─── Tests d'Acceptation (BDD) ──────────────────────────────
  # Responsable : Product Owner (scénarios) + QA (step definitions)
  # Pas de dépendance externe (repository in-memory)
  acceptance-tests:
    name: "Tests d'Acceptation (BDD)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run acceptance tests
        run: flutter test test/acceptance/

  # ─── Tests d'Intégration ─────────────────────────────────────
  # Responsable : Développeur + QA
  # Nécessite une vraie base de données PostgreSQL
  integration-tests:
    name: "Tests d'Intégration"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install server dependencies
        run: cd server && dart pub get

      - name: Run integration tests
        run: cd server && dart test test/integration/ --concurrency=1
        env:
          TEST_DATABASE_URL: postgres://todo:todo@localhost:5432/todo_test
