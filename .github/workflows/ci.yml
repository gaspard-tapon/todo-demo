name: CI/CD Pipeline

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

jobs:
  # ─── Tests Unitaires ─────────────────────────────────────────
  # Responsable : Développeur
  # Pas de dépendance externe (mocks uniquement)
  unit-tests:
    name: "Tests Unitaires"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run frontend unit tests with coverage
        run: flutter test test/unit/ --coverage

      - name: Install server dependencies
        run: cd server && dart pub get

      - name: Analyze server code
        run: cd server && dart analyze

      - name: Run server unit tests
        run: cd server && dart test test/unit/

  # ─── Tests d'Acceptation (BDD) ──────────────────────────────
  # Responsable : Product Owner (scénarios) + QA (step definitions)
  # Pas de dépendance externe (repository in-memory)
  acceptance-tests:
    name: "Tests d'Acceptation (BDD)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run acceptance tests
        run: flutter test test/acceptance/

  # ─── Tests d'Intégration ─────────────────────────────────────
  # Responsable : Développeur + QA
  # Nécessite une vraie base de données PostgreSQL
  integration-tests:
    name: "Tests d'Intégration"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install server dependencies
        run: cd server && dart pub get

      - name: Run integration tests
        run: cd server && dart test test/integration/ --concurrency=1
        env:
          TEST_DATABASE_URL: postgres://todo:todo@localhost:5432/todo_test

  # ─── Tests Système (E2E) ─────────────────────────────────────
  # Responsable : QA
# ─── Déploiement ─────────────────────────────────────────────
  # Responsable : DevOps
  # Déclenche le webhook Dokploy après tous les tests
  deploy:
    name: "Déploiement Dokploy"
    runs-on: ubuntu-latest
    needs: [unit-tests, acceptance-tests, integration-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy deployment
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOKPLOY_APP_ID }}\"}" \
            "https://admin.gaspardtapon.fr/application.deploy")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error: Deployment failed"
            exit 1
          fi
